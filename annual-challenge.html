<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>年度注音闖關｜池東探險島</title><link rel="stylesheet" href="annual-challenge.css?v=20261111-retry2"></head>
<body>
<div class="preview-note">年度注音闖關</div>
<header><a class="brand" href="annual-challenge.html"><span>🏝️</span><span>池東探險島<small>一年一度・注音闖關日</small></span></a><a id="home-link" class="home-link" href="https://j822925.github.io/zhuyin-game-new/?class=main">⌂ 回池東探險島</a><div id="identity"></div></header>
<main id="app"><p>正在準備闖關卡…</p><p class="subtle">請保持網路連線。若沒有完成載入，請重新整理此頁。</p></main><div id="status" role="status" aria-live="polite"></div>
<dialog id="unlock-dialog"><div class="row"><h2>請把畫面交給關主</h2><button id="cancel-unlock" aria-label="取消關主解鎖">✕</button></div><p id="unlock-context"></p><p class="subtle">這是本機示範解鎖。接正式平台時，須經關主身分驗證；孩子的登入會保留。</p><p id="unlock-error" role="alert"></p><button id="confirm-unlock" class="primary wide">示範關主解鎖</button></dialog>
<dialog id="award-dialog" data-step="1"><form id="award-form"><div class="row"><h2>關主評分與簽章</h2><button type="button" id="close-award" aria-label="關閉">✕</button></div><div class="award-step-label" id="award-step-label">1／2 分數與印章</div><div id="award-preference" class="award-preference" aria-live="polite"></div><section id="award-step-score" data-panel="award-score"><p id="score-hint"></p><label class="score-label">這一關的分數 <input id="award-score" type="number" min="0" max="20" step="1" readonly aria-label="本關分數"> ／20 分</label><div id="score-options" class="score-options" aria-label="選擇零至二十分"></div><p class="stamp-label">選一枚可愛的過關章</p><div id="stamp-options" class="stamp-options"></div><div class="award-step-actions"><button type="button" class="primary" id="award-next">下一步，手寫簽名 →</button></div></section><section id="award-step-sign" data-panel="award-sign" hidden><nav class="screen-tabs" aria-label="簽章內容"><button type="button" data-sign-panel="signature" class="selected">✍ 手寫簽名</button><button type="button" data-sign-panel="note">💬 建議（選填）</button></nav><div id="award-signature-panel"><label for="signature">關主手寫簽名</label><canvas id="signature" aria-label="關主手寫簽名區"></canvas><div class="row"><button type="button" id="clear-signature" class="quiet">清除重簽</button><span class="subtle">手指或觸控筆都可以</span></div></div><div id="award-note-panel" hidden><label class="note-label">給孩子的建議（選填）<textarea id="award-note" maxlength="200" rows="2" placeholder="可留白"></textarea></label></div><div class="award-step-actions"><button type="button" id="award-previous">← 分數與印章</button><button class="primary" id="save-award">確認分數，蓋章保存</button></div></section><p id="award-error" role="alert"></p></form></dialog>
<script src="annual-challenge-bootstrap.js?v=20261111-retry2"></script></body></html>
