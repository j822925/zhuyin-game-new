<!doctype html><html lang="zh-Hant" data-student="authenticated"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>加入全班問答｜注音探險島</title><link rel="stylesheet" href="classroom.css?v=20261004-quiz2"></head><body>
<header><a class="home" href="https://j822925.github.io/zhuyin-game-new/?demo=1">🏡 回教師試玩</a><span id="connection" role="status">尚未連線</span></header>
<main><p class="notice">🧪 全班問答測試版・雲端連線｜不發星星、不寫入正式成績。孩子只填座號，不需要正式帳號密碼。</p><h1>🌟 全班注音問答</h1><p id="message" role="status" aria-live="polite"></p>
<section id="entrance"><div id="teacher-entry" hidden><h2>👩‍🏫 老師主持</h2><p>使用原本已授權的 Google 帳號。請保持這個分頁開啟；離開或斷線時題目會暫停。</p><button id="teacher-login">用 Google 登入</button><div id="setup" hidden>
<form id="create-form"><label>班級<select id="class-id"></select></label><label>活動名稱<input id="title" maxlength="40" value="全班注音挑戰" required></label><label>題型<select id="mode"><option value="single">聽音辨識</option><option value="spelling">拼音選擇（選完整拼音）</option></select></label><label>題數<select id="count"><option value="10">10 題</option><option value="25">25 題</option><option value="5">5 題</option></select></label><label>每題作答時間<select id="seconds"><option value="30">30 秒</option><option value="20">20 秒</option><option value="45">45 秒</option><option value="60">60 秒</option></select></label>
<fieldset><legend>出題範圍</legend><div class="toolbar"><button type="button" id="taught">帶入本班已教範圍</button><button type="button" id="all">全部選取</button><button type="button" id="none">全部取消</button></div><div id="scope" class="scope"></div></fieldset>
<p>每題答對得 1000 分，不按速度加分。題庫不足時才重複出題，至少須有 4 個可出題項目。</p><button class="primary" id="create">✨ 建立房間</button></form><h3>恢復我主持的房間</h3><div id="host-rooms"></div></div></div>
<div id="student-entry"><h2>🎒 加入全班問答</h2><form id="join-form"><label>老師的六位房號<input id="room-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required></label><label>你的座號<input id="seat" inputmode="numeric" pattern="[0-9]{1,3}" maxlength="3" autocomplete="off" required></label><button class="primary" id="join">🚀 加入房間</button></form><p>只填座號，不填姓名、Google 信箱或正式密碼。</p><a href="classroom.html?role=teacher">我是老師，要主持活動 →</a></div></section>
<section id="room" hidden><div class="room-top"><h2 id="room-title"></h2><span id="my-seat"></span></div><div id="room-number" class="room-number"></div><div id="invite" hidden><p>孩子可以從教師試玩中心的「全班問答」加入，輸入上面的六位房號。</p><button id="copy-link">📋 複製學生加入連結</button><a id="student-link" target="_blank" rel="noopener">開學生加入頁</a></div>
<h2 id="phase-title"></h2><p id="progress"></p><p id="timer" class="timer" aria-live="off"></p><div id="audio-area" hidden><button id="listen" class="listen">🔊 聽題目／再聽一次</button><p id="audio-status" role="status"></p></div>
<div id="choices" class="choices"></div><p id="feedback" class="feedback" role="status"></p><div id="controls" class="toolbar"></div><div id="players"></div><div id="ranking"></div><div id="report"></div><p id="room-note" class="note"></p><button id="reconnect" hidden>↻ 重新連線</button></section>
</main><script type="module" src="classroom-student.js?v=20261004-quiz2"></script></body></html>
