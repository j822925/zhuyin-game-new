<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的錯題本｜注音探險島</title><link rel="stylesheet" href="exam.css?v=20260928-all1"><link rel="stylesheet" href="student-auth.css?v=20260928-all1"><link rel="stylesheet" href="child-navigation.css?v=20260928-all1"><link rel="stylesheet" href="notebook.css?v=20260928-all1"></head><body><main>
<header><a data-child-home href="./">🏠 回首頁</a><h1>📖 我的錯題本</h1><p>再練一次，答對就畢業！不扣星星，也不影響小考成績。</p></header>
<section id="login-area"><label>我的座號 <select id="seat"><option value="">選擇座號</option></select></label><label>我要複習 <select id="mode"><option value="all">全部錯題</option><option value="single">聽音辨識</option><option value="spelling">拼音工坊</option></select></label><button id="start" disabled>📖 打開我的錯題本</button></section>
<p id="home-message" role="status" aria-live="polite"></p><button id="retry" hidden>🔄 重新連線</button>
<section id="practice" hidden><p id="count"></p><h2 id="mode-label"></h2><button id="listen" class="review-listen">🔊 再聽一次</button><p id="audio-status" role="status"></p><div id="choices"></div><div id="spelling" hidden><div class="slots"><output id="initial-slot" aria-label="聲符作答區"></output><output id="final-slot" aria-label="韻符作答區"></output><span id="tone"></span></div><p>① 選聲符</p><div id="initial-choices" class="tiles"></div><p>② 選韻符或結合韻</p><div id="final-choices" class="tiles"></div></div><button id="submit" disabled>✓ 確定答案</button></section>
<section id="feedback" hidden><div id="feedback-icon" aria-hidden="true"></div><h2 id="feedback-title"></h2><p id="correct-answer"></p><button id="replay">🔊 聽正確答案</button><button id="next">➡ 下一題</button></section>
<section id="empty" hidden><div class="graduate" aria-hidden="true">🌟</div><h2>太棒了！這裡沒有待複習的錯題</h2><p>答對的錯題已經畢業，之後再答錯才會回來。</p><a data-child-home href="./">🏠 回首頁</a></section>
</main><script type="module" src="notebook.js?v=20260928-all1"></script><script type="module" src="child-navigation.js?v=20260928-all1"></script></body></html>
