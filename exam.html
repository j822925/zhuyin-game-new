<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注音探險島｜小考</title><link rel="stylesheet" href="exam.css?v=20260919-exam1"><link rel="stylesheet" href="student-auth.css?v=20260913-tutor1"></head><body>
<main><header><a href="./">⌂ 回遊戲</a><h1>📝 注音小考</h1><p id="clock" role="status"></p></header>
<section id="login-area"><label>🔢 選擇座號 <select id="seat"><option value="">選擇座號</option></select></label><label>老師的小考 <select id="exam-select"></select></label><p>每場只能考一次，共 25 題。答對每 5 題得 1 星，全對共 5 星。題目送出後不能改答案。</p><p>斷線請留在這個頁面；重新整理後選原座號，可接續已保存進度。時間結束後不能補答，未答題不給分。</p><button id="start" disabled>開始／接續小考</button></section>
<p id="home-message" role="status"></p><button id="recover" hidden>🔄 重新連線／恢復進度</button>
<section id="question-area" hidden><h2 id="exam-title"></h2><p id="progress"></p><button id="listen">🔊 聽題目</button><p id="audio-status" role="status"></p><div id="choices"></div><div id="spelling-area" hidden><div class="slots"><output id="initial-slot" aria-label="聲符"></output><output id="final-slot" aria-label="韻符"></output><span id="tone"></span></div><div id="initial-choices" class="tiles"></div><div id="final-choices" class="tiles"></div></div><button id="submit" disabled>✓ 確定答案</button><p>送出後進入下一題；小考不提供小老師或答案提示。</p></section>
<section id="result" hidden><h2>小考已交卷</h2><p id="score"></p><p id="stars"></p><a href="./">⌂ 回遊戲查看星星</a></section></main><script type="module" src="exam.js?v=20260919-exam1"></script></body></html>
