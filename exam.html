<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注音探險島｜小考</title><link rel="stylesheet" href="exam.css?v=20260919-egg1"><link rel="stylesheet" href="star-cards.css?v=20260919-egg1"><link rel="stylesheet" href="student-auth.css?v=20260913-tutor1"><link rel="stylesheet" href="student-profile.css?v=20260919-steady1"></head><body>
<main><header><a href="./">⌂ 回遊戲</a><h1>📝 注音小考</h1><p id="clock" role="status"></p></header>
<section id="login-area"><label>🔢 選擇座號 <select id="seat"><option value="">選擇座號</option></select></label><label>老師的小考 <select id="exam-select"></select></label><p>每場只能考一次，共 25 題。答對每 5 題得 1 星，全對共 5 星。題目送出後不能改答案。</p><p>斷線請留在這個頁面；重新整理後選原座號，可接續已保存進度。時間結束後不能補答，未答題不給分。</p><button id="start" disabled>開始／接續小考</button></section>
<p id="home-message" role="status"></p><button id="recover" hidden>🔄 重新連線／恢復進度</button>
<section id="question-area" hidden><h2 id="exam-title"></h2><p id="progress"></p><div class="exam-layout"><div class="exam-work"><div id="question-controls"><button id="listen">🔊 聽題目</button><p id="audio-status" role="status"></p><div id="choices"></div><div id="spelling-area" hidden><div class="slots"><output id="initial-slot" aria-label="聲符"></output><output id="final-slot" aria-label="韻符"></output><span id="tone"></span></div><div id="initial-choices" class="tiles"></div><div id="final-choices" class="tiles"></div></div><button id="submit" disabled>✓ 確定答案</button><p>答案送出後不能改；答錯時一起看正確答案、完整聽兩遍，再繼續。</p></div><div id="exam-review" hidden><h3>一起記住這個聲音！</h3><p>正確答案是</p><div id="review-answer" aria-label="正確答案"></div><p id="review-status" role="status"></p><button id="review-play" type="button">🔊 一起再聽兩遍</button><p class="review-hint">完整聽完兩遍才會繼續。原本的作答成績不變。</p></div></div></div></section>
<section id="result" hidden><h2>小考已交卷</h2><p id="score"></p><p id="stars"></p><a href="./">⌂ 回遊戲查看星星</a></section><section id="star-collection" hidden></section></main><script type="module" src="exam.js?v=20260920-sprites1"></script></body></html>
