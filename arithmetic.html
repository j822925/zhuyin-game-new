<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#244f45"><title>加減玩｜池東探險島</title><link rel="stylesheet" href="character-motion.css?v=20261007-ipad1"><link rel="stylesheet" href="monster-cards.css?v=20261011-battle1"><link rel="stylesheet" href="battle-rpg.css?v=20261011-battle1"><link rel="stylesheet" href="arithmetic.css?v=20261115-math2"></head><body><div class="shell">
<header><a id="home-link" href="./" class="brand">池東探險島</a><div class="header-actions"><span id="identity"></span><button id="back" class="back-button"><img src="assets/ui/nav-back.svg" alt="" width="36" height="36"><span>返回</span></button></div></header>
<div id="demo-note" class="notice" hidden>教師試玩 · 不計入正式成績與星星</div><p id="error" role="alert"></p><p id="storage-warning" role="status"></p><p id="loading">準備中…</p>
<main><section id="entry" hidden><h1 class="game-title">加減玩</h1><div id="levels" class="levels" aria-label="數字範圍"></div><div class="option-row"><label>運算<select id="operation"><option value="mix">加減混合</option><option value="add">加法 ＋</option><option value="sub">減法 －</option></select></label><label>進退位<select id="skill"><option value="mixed">綜合</option><option value="basic">不進位／不退位</option><option value="regroup">進位／退位</option></select></label><label>題數<select id="count"><option value="5">5 題</option><option value="10" selected>10 題</option><option value="20">20 題</option></select></label></div><button id="start" class="primary start">開始玩 →</button><button id="resume" class="resume" hidden>繼續上次練習 →</button></section>
<section id="play" hidden><div class="play-heading"><h1 id="play-label"></h1><span id="counter"></span></div><progress id="progress" max="10" value="0" aria-label="作答進度"></progress><div class="arena"><div class="question-panel"><div class="equation"><span id="equation"></span><span>＝</span><output id="answer" aria-live="polite" aria-label="輸入的答案">?</output></div><div id="keypad" class="keypad" aria-label="數字鍵盤"></div><div id="feedback" role="status" aria-live="polite"></div><div class="answer-actions"><button id="hint-button">💡 提示</button><button id="submit" class="primary">出招！</button><button id="next" class="primary" hidden>下一題 →</button></div><div id="hint-panel" hidden><p id="hint-text"></p><div id="hint-visual"></div></div><details id="scratch-panel"><summary>✎ 直式草稿</summary><div class="scratch-heading"><span id="scratch-equation"></span><button id="clear-scratch">清除</button></div><canvas id="scratch" width="600" height="260" aria-label="可用手指書寫的草稿區"></canvas></details></div>
<aside class="battle-panel" aria-label="戰鬥"><div class="battle-stage"><div id="opponent-slot"></div><div class="hero-wrap"><div id="hero"></div><progress id="hero-hp" max="10" value="10" aria-label="夥伴能量"></progress></div></div></aside></div></section>
<section id="result" class="result-panel" hidden><h1>完成了！</h1><p id="result-score"></p><p id="reward-status" role="status"></p><p id="result-detail"></p><p id="save-status" role="status"></p><button id="retry-save" hidden>重新儲存</button><button id="finish" class="primary">返回 →</button><details><summary>看看這次的計算</summary><div id="result-rows"></div></details></section></main></div><script type="module" src="arithmetic.js?v=20261115-math2"></script></body></html>
