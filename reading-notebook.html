<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>朗讀錯題本｜池東注音探險島</title><link rel="stylesheet" href="student-auth.css?v=20261009-accounts1"><link rel="stylesheet" href="exam-tone-input.css?v=20261023-exam1"><link rel="stylesheet" href="exam-reading.css?v=20261023-readingexam1"><link rel="stylesheet" href="notebook.css?v=20261023-notebook1"></head><body class="reading-page"><main>
<header><a id="home" href="./">🏠 學習廣場</a><h1>🎙️ 朗讀錯題本</h1><button id="account" hidden></button></header>
<nav aria-label="錯題本分類"><a href="notebook.html">📖 其他錯題本</a><span class="reading-label">🎙️ 朗讀</span></nav>
<section id="login-area"><label>我的學號 <select id="seat"><option value="">選擇學號</option></select></label><button id="start" disabled>打開錯題本</button></section>
<div id="connection"><p id="home-message" role="status" aria-live="polite"></p><button id="retry" hidden>🔄 重新連線</button></div>
<section id="practice" hidden><div class="question-bar"><h2 id="mode-label"></h2><span id="count"></span><button id="listen">🔊 再聽一次</button></div><p id="audio-status" role="status"></p><div id="choices" class="tiles"></div><div id="spelling" hidden><div class="spelling-head"><button id="initial-slot" aria-label="選聲符"></button><button id="final-slot" aria-label="選韻符"></button><span id="tone"></span></div><div class="spelling-group"><span id="initial-label">聲符</span><div id="initial-choices" class="tiles" role="group" aria-labelledby="initial-label"></div></div><div class="spelling-group"><span id="final-label">韻符</span><div id="final-choices" class="tiles" role="group" aria-labelledby="final-label"></div></div></div><div id="tone-input" hidden></div><div id="reading-input" hidden></div><div class="action-row"><button id="submit" disabled>✓ 確定答案</button></div></section>
<section id="feedback" hidden><div id="feedback-icon" aria-hidden="true"></div><h2 id="feedback-title"></h2><p id="correct-answer"></p><div class="action-row"><button id="replay">🔊 再聽一次</button><button id="next">下一題 ▶</button></div></section>
<section id="empty" hidden><div class="graduate" aria-hidden="true">🌟</div><h2>這裡的錯題都畢業了！</h2><a href="./">🏠 學習廣場</a></section>
</main><script type="module" src="notebook.js?v=20261023-notebook1"></script></body></html>
