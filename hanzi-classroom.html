<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上課選字｜國字森林</title><link rel="stylesheet" href="hanzi.css?v=20261116-names1"><link rel="stylesheet" href="hanzi-lesson.css?v=20261118-ink2"><link rel="stylesheet" href="hanzi-board-fit.css?v=20261118-ink2"><script type="module" src="hanzi-board-fit.js?v=20261118-ink2"></script></head><body><div class="page-shell"><header class="masthead"><a class="back-link" id="camp" href="hanzi.html">↩ 國字森林</a></header><main class="class-panel"><h1 id="heading">上課選字</h1><div id="preview" hidden>教師試玩 · 不記正式星星</div><p id="message" role="status"></p><section id="choose" hidden><label for="character">選一個字</label><select id="character"></select><label for="mode">怎麼練習？</label><select id="mode"><option value="imitate">仿寫</option><option value="write">看注音寫國字</option><option value="read">看國字寫注音</option></select><p id="availability"></p><p>每完成一次得 1 顆星。同一個字、同一種練習，每天最多 3 顆。</p><button class="primary" id="start">開始練習 →</button></section><section id="exercise" hidden><h2 id="instruction"></h2><div id="model" class="hz-class-model"></div><div id="board"></div><div id="symbols" hidden><output id="answer" class="hz-response" aria-label="已選注音"></output><div id="keys" class="hz-keypad"></div></div><div><button id="undo">退一筆</button><button id="clear">重寫</button><button id="show-demo">看筆順</button></div><button class="primary" id="finish">完成這一次</button><button id="back">重新選字</button></section><section id="result" hidden><p id="feedback"></p><button class="primary" id="again">再練一次</button><button id="change">換一個字</button></section><button id="retry" hidden>重新連線</button></main></div><script type="module" src="hanzi-classroom.js?v=20261118-ink2"></script></body></html>
