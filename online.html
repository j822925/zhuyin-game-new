<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#477e68"><title>注音探險島・連線對戰</title><link rel="stylesheet" href="online.css?v=20260920-live1"><link rel="stylesheet" href="child-navigation.css?v=20260921-nav1"></head><body>
<div class="test-banner">🌟 注音探險島・和同學一起練習</div>
<header><button id="home" aria-label="回對戰首頁">⌂</button><h1>一起來對戰</h1><span id="identity">先選自己的座號</span><button id="logout" hidden>換人登入</button></header>
<main><p id="message" role="status" aria-live="polite"></p><section id="login" class="panel"><h2>🔢 先登入，再找同學</h2><p>回島嶼選自己的座號，輸入密碼，就能來玩。</p><a class="primary" data-child-home href="./">🏡 回島嶼登入</a></section><button id="load-retry" hidden>重新讀取</button>
<section id="lobby" hidden><div class="meadow"><img id="my-character" alt="我的角色"></div><fieldset class="mode-picker"><legend>要玩哪一個關卡？</legend><label><input type="radio" name="lesson" value="single" checked><span>🔊 聽音辨識</span></label><label><input type="radio" name="lesson" value="spelling"><span>🧩 拼音工坊</span></label></fieldset><fieldset class="mode-picker"><legend>開房間要怎麼玩？</legend><label><input type="radio" name="mode" value="race" checked><span>⚡ 搶答對戰<small>一起搶答・共 10 題</small></span></label><label><input type="radio" name="mode" value="turn"><span>🤝 輪流答題<small>一人一題・每人 10 題</small></span></label></fieldset><div class="home-grid"><button id="create" class="big"><span>🏠</span><strong>開房間</strong><small>請同學來找我</small></button><button id="join-show" class="big"><span>🔎</span><strong>找同學</strong><small>輸入同學的房號</small></button></div><button id="recover-room" hidden>🔄 回到剛剛的房間</button><p class="hint">題目可以再聽一次・加入同學房間會使用房主選的模式<br>輪流練習會列入學習紀錄；搶答另列比賽紀錄。</p></section>
<section id="room" hidden><div class="room-top"><strong>房號 <span id="room-code"></span></strong><strong id="room-mode"></strong><span id="connection" role="status"></span><button id="leave">離開房間</button></div><div id="people" class="people"></div><section class="panel battle-panel"><h2 id="phase-title" aria-live="polite"></h2><p id="phase-detail"></p><p id="progress"></p><div id="question"><button id="listen" class="listen" aria-label="重播題目聲音">🔊 再聽一次</button><p id="audio-status" role="status"></p><div id="choices" class="choices"></div></div><div id="result-answer" class="answer"></div><button id="action" class="primary" hidden></button><button id="reconnect" hidden>📶 重新連線</button><button id="takeover" hidden>換到這台平板繼續</button><div id="summary"></div></section></section>
<p class="footer"><a data-child-home href="./">🏡 回注音探險島</a> · 使用原本座號、角色和星星</p></main>

<dialog id="join-dialog"><button id="join-close" class="close" aria-label="關閉房號輸入">✕</button><h2>🔎 同學的房號是多少？</h2><input id="join-code" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="四位房號"><div id="join-pad" class="keypad"></div><button id="join" class="primary">去找同學 ➜</button><p id="join-error" role="status"></p></dialog>
<script type="module" src="online.js?v=20260925-tonefix1"></script><script type="module" src="child-navigation.js?v=20260921-nav1"></script></body></html>
