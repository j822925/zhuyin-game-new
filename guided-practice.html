<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>課堂練習｜池東探險島</title><link rel="stylesheet" href="guided-practice.css?v=20261127-1"></head><body><main>
<header><a id="home" href="./">↩ 學習廣場</a><h1>課堂練習</h1><button id="list" hidden>回練習清單</button></header>
<p id="status" role="status"></p><section id="plans"></section>
<section id="exercise" hidden><div class="top"><strong id="title"></strong><span id="progress"></span><span id="score"></span></div>
<div id="work"><div class="left"><h2 id="prompt"></h2><div id="context"></div><button id="sound" hidden>▶ 聽一遍</button><div id="model"></div></div>
<div id="input"><div id="ink"></div><svg id="replay" aria-label="我的筆跡重播" viewBox="0 0 1 1" hidden></svg><div id="other"></div></div>
<div class="tools"><div id="notice" role="status"></div><button id="trace" hidden>開啟淡色底字</button><button id="demo" hidden>▶ 看正確筆順</button><button id="againReplay" hidden>▶ 看我的筆跡</button><button id="clear" hidden>重寫</button><button id="submit" class="primary">送出答案</button><button id="next" class="primary" hidden>下一題 →</button></div></div></section>
<section id="result" hidden><h2 id="final"></h2><div id="reward-pictures" hidden></div><p id="gift"></p><button id="done">回練習清單</button></section>
</main><script type="module" src="guided-practice.js?v=20261127-alltrace1"></script></body></html>
