<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>怪物與角色動作預覽</title><link rel="stylesheet" href="character-motion.css?v=20261003-size1"><link rel="stylesheet" href="monster-cards.css?v=20260928-all1"><style>

8px;min-height:365px}.monster-card-stage{height:190px}.monster-theater .monster-card-stage{height:205px}.monster-card h3{font-size:18px}.monster-card-kind{letter-spacing:0;font-size:11px}h1{font-size:26px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main><span class="tag">注音探險島 · 角色與怪物</span><h1>一題一招，迎戰小怪物！</h1><p><a href="./?demo=1" style="display:inline-block;background:#52705b;color:white;border-radius:14px;padding:12px 20px;text-decoration:none">進入練習試玩 →</a></p><p class="intro">左邊是怪物，右邊是孩子的角色。答對發動攻擊、答錯被擊退，獲得星星時會雙手捧起星星。爆星騎士以流光斬迎敵，棉花兔穿著原本的雛菊裙，以可愛的花朵出擊。所有角色都有各自的攻擊、防禦、勝利與捧星星姿勢；四位反派也會蓄力出招、受擊和認輸。</p><div class="pickers"><label>怪物造型預覽（遊戲中隨機遇到）<select id="monster"></select></label><label>孩子的角色<select id="hero"></select></label></div><section class="preview-stage battle-layout rpg-stage" id="stage"><div class="controls"><button id="right">✓ 答對了・攻擊怪物</button><button id="wrong">↻ 答錯了・怪物反擊</button><button id="stars">★ 捧起星星</button><button id="reset">重新挑戰</button><p id="motion-label" role="status"></p></div><div class="hero-wrap"><div class="hero-art" id="hero-art"></div><strong id="hero-name"></strong></div></section><p class="preview-note">這是動作與卡面預覽，不會寫入學生成績或收藏。正式練習每回合隨機遇到怪物；同一隻累積全對擊敗 3 次並保存成功，才會加入收藏，並可選為我方角色、向左出招。</p><h2>四種怪物，四種卡面</h2><p>古堡拱框、冰晶斜框、薔薇荊棘框與假面舞台，搭配各自不同的身形與性格。</p><div id="cards"></div></main><script type="module">
import {PROFILE_CHARACTERS} from './student-profile.js?v=20261003-size1';
import {MONSTERS} from './data/monsters.js?v=20260928-all1';
import {mountCharacter,reactCharacter,choreography} from './character-motion.js?v=20261003-size1';
import {createOpponent,createBattle,updateOpponent} from './character-battle.js?v=20261003-size1';
import {monsterCard} from './monster-cards-ui.js?v=20260928-allies1';
const $=id=>document.getElementById(id),enemy=createOpponent();$('stage').prepend(enemy);const battle=createBattle(enemy,()=>$('hero-art'));let hits=0;
for(const c of MONSTERS){$('monster').append(new Option(c.name,c.id));$('cards').append(monsterCard(c,{preview:true}));}for(const c of PROFILE_CHARACTERS)$('hero').append(new Option(c.name,c.id));const requestedHero=new URLSearchParams(location.search).get('hero');$('hero').value=PROFILE_CHARACTERS.some(c=>c.id===requestedHero)?requestedHero:'star-01-bo';
const requestedMonster=new URLSearchParams(location.search).get('monster');if(MONSTERS.some(c=>c.id===requestedMonster))$('monster').value=requestedMonster;
function refresh(){battle.reset();hits=0;updateOpponent(enemy,MONSTERS.find(c=>c.id===$('monster').value),10,hits);const c=PROFILE_CHARACTERS.find(c=>c.id===$('hero').value);mountCharacter($('hero-art'),c);$('hero-name').textContent=c.name;$('motion-label').textContent=c.id==='star-01-bo'?'爆星流光斬・舉盾抵擋・持劍致意':c.id==='rabbit'?'小跳步花花攻擊・縮身護臉・開心揮手':choreography(c).label;}
$('hero').onchange=$('monster').onchange=$('reset').onclick=refresh;$('right').onclick=()=>{if(hits===10)hits=0;battle.answer(true);updateOpponent(enemy,MONSTERS.find(c=>c.id===$('monster').value),10,++hits);};$('wrong').onclick=()=>battle.answer(false);$('stars').onclick=()=>{battle.reset();reactCharacter($('hero-art'),'star');};refresh();
</script></body></html>
