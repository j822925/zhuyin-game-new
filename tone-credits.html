<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聲調小劇場・老師錄音</title><style>body{max-width:900px;margin:24px auto;padding:16px;font:18px/1.7 system-ui;background:#faf7eb;color:#31554b}a{color:#296b95}</style><a href="tone.html">🏡 回聲調小劇場</a><h1>老師親自錄製的聲音</h1><p>本關使用老師提供的詞語與短句錄音，經裁切空白、降低底噪及整理音量，保留原來的語速與音高。</p><p>題目與答案依老師確認的版本；連續三聲歸有變音，其餘歸無變音。兩題披薩相關內容不出題。先前的外部試用錄音不再使用。</p><p>錄音為老師提供予本平台的教學素材，不因放上平台而成為公共領域素材。</p></html>
